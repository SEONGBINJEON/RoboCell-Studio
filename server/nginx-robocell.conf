# Install only after static files and loopback API pass checks.
limit_req_zone $binary_remote_addr zone=robocell_ai:10m rate=10r/m;
server {
    listen 80;
    server_name 13.207.111.2;
    root /var/www/robocell;
    index index.html;
    server_tokens off;
    client_max_body_size 128k;
    client_body_timeout 15s;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    location ~ /\. { deny all; }
    location ~* \.(pem|key|env|sqlite3?|log|py|service)$ { deny all; }
    location ~ ^/api/ai/(assist|report)$ {
        limit_req zone=robocell_ai burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 65s;
        proxy_connect_timeout 3s;
        proxy_buffering off;
    }
    location = /api/ai/status {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 5s;
    }
    location /isaac/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /api/ { return 404; }
    location ~* \.(html|js|mjs|css)$ {
        add_header Cache-Control no-cache;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
        try_files $uri =404;
    }
    location / { try_files $uri $uri/ =404; }
}
