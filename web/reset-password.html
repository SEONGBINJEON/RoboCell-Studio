<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111310">
  <meta name="description" content="RoboCell Studio 비밀번호 재설정">
  <title>비밀번호 재설정 — RoboCell Studio</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="auth.css">
  <script src="supabase-config.js"></script>
  <script type="module" src="reset-password.js"></script>
  <link rel="stylesheet" href="typography.css">
</head>
<body class="auth-page">
  <a class="skip-link" href="#reset-title">비밀번호 재설정으로 이동</a>
  <main class="auth-shell">
    <section class="auth-intro" aria-labelledby="auth-intro-title">
      <a class="auth-wordmark" href="index.html" aria-label="RoboCell Studio 홈"><img class="brand-logo-mark" src="assets/robocell-logo-mark-black-yellow.png" alt="" aria-hidden="true"><span class="brand-name">Robo<span class="brand-cell">Cell</span><span class="brand-studio">Studio</span></span></a>
      <div class="auth-intro-copy">
        <p class="eyebrow"><span class="square"></span> ACCOUNT SECURITY</p>
        <h1 id="auth-intro-title">안전하게<br><span>다시 시작</span>하세요.</h1>
        <p>새 비밀번호를 설정한 뒤<br>우리 기업의 공정 검토를 이어갈 수 있습니다.</p>
      </div>
      <p class="auth-image-caption">가상 로봇 셀 · 콘셉트 이미지</p>
    </section>

    <section class="auth-panel" aria-labelledby="reset-title">
      <a class="auth-back" href="login.html"><span aria-hidden="true">←</span> Login으로 돌아가기</a>
      <div class="auth-form-wrap">
        <p class="eyebrow dark">RESET PASSWORD</p>
        <h2 id="reset-title">새 비밀번호 설정</h2>
        <p class="auth-lead">이메일의 재설정 링크로 들어온 뒤<br>새 비밀번호를 입력해 주세요.</p>
        <form id="reset-password-form" novalidate>
          <label for="new-password">새 비밀번호</label>
          <div class="password-row"><input id="new-password" name="password" type="password" autocomplete="new-password" placeholder="8자 이상 입력하세요" minlength="8" required aria-describedby="reset-status"><button type="button" id="reset-password-toggle" class="password-toggle" aria-label="비밀번호 표시" aria-pressed="false">표시</button></div>
          <label for="new-password-confirm">새 비밀번호 확인</label>
          <input id="new-password-confirm" name="passwordConfirm" type="password" autocomplete="new-password" placeholder="비밀번호를 한 번 더 입력하세요" minlength="8" required aria-describedby="reset-status">
          <button class="auth-submit" type="submit">비밀번호 변경하기 <span aria-hidden="true">↗</span></button>
          <p id="reset-status" class="auth-status" role="status">재설정 링크를 통해서만 비밀번호를 변경할 수 있습니다.</p>
        </form>
      </div>
      <p class="auth-footer">© 2026 RoboCell Studio <span>·</span> 경북 중소 제조기업을 위한 공정 설계 플랫폼</p>
    </section>
  </main>
</body>
</html>
