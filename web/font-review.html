<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>RoboCell 글꼴 비교</title>
  <link rel="stylesheet" href="typography.css">
  <style>
    @font-face{font-family:Pretendard;src:url('assets/fonts/PretendardVariable.woff2') format('woff2');font-weight:100 900;font-display:swap}
    @font-face{font-family:SUIT;src:url('assets/fonts/suit/SUIT-Regular.woff2') format('woff2');font-weight:400;font-display:swap}
    @font-face{font-family:SUIT;src:url('assets/fonts/suit/SUIT-Medium.woff2') format('woff2');font-weight:500;font-display:swap}
    @font-face{font-family:SUIT;src:url('assets/fonts/suit/SUIT-SemiBold.woff2') format('woff2');font-weight:600;font-display:swap}
    @font-face{font-family:'Wanted Sans';src:url('assets/fonts/wanted-sans/WantedSans-Regular.woff2') format('woff2');font-weight:400;font-display:swap}
    @font-face{font-family:'Wanted Sans';src:url('assets/fonts/wanted-sans/WantedSans-Medium.woff2') format('woff2');font-weight:500;font-display:swap}
    @font-face{font-family:'Wanted Sans';src:url('assets/fonts/wanted-sans/WantedSans-SemiBold.woff2') format('woff2');font-weight:600;font-display:swap}
    *{box-sizing:border-box}body{margin:0;background:#e9ecef;color:#242a31;line-height:1.55;font-variant-numeric:tabular-nums lining-nums}header{padding:22px 28px;background:#202630;color:#edf0f3}header h1{font-size:22px;font-weight:500;margin:0 0 5px}header p{margin:0;color:#b8c0cb;font-size:13px}.toolbar{display:flex;gap:18px;align-items:center;padding:14px 28px;background:#fff;border-bottom:1px solid #cdd3da}.toolbar label{display:flex;gap:8px;align-items:center}.toolbar button{font:inherit;border:1px solid #adb7c2;padding:5px 11px;background:#f3f5f7;border-radius:3px;cursor:pointer}.toolbar input{accent-color:#7d6c2a}.toolbar output{margin-left:auto;color:#596572;font-size:12px}main{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;padding:20px 28px}.specimen{min-width:0;background:#fff;border:1px solid #c5ced8}.family{padding:16px;border-bottom:1px solid #cbd2da;min-height:83px;background:#f6f7f9}.family h2{font-family:system-ui,sans-serif;font-size:18px;line-height:1.3;font-weight:600;margin:0 0 5px}.family p{font-family:system-ui,sans-serif;color:#66717d;font-size:12px;margin:0}.candidate .family{border-top:3px solid #b39437;padding-top:13px}.specimen section{padding:16px;border-bottom:1px solid #e0e4e8}.specimen section:last-child{border:0}.caption{font-family:system-ui,sans-serif;font-size:11px;letter-spacing:.02em;color:#77828e;display:block;margin-bottom:8px}.title{font-size:19px;font-weight:600;line-height:1.45;margin:0}.body-text{font-size:14px;line-height:1.7;margin:0}.weight-lines{display:grid;gap:6px;font-size:14px}.labels{display:flex;gap:12px;font-size:13px;font-weight:500;margin-bottom:12px}.labels span:first-child{border-bottom:2px solid #a68a36;padding-bottom:4px}.field{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field label{display:grid;gap:5px;font-size:13px;color:#5b6671}.field input{min-width:0;width:100%;font-family:inherit;font-size:14px;padding:6px 8px;border:1px solid #bcc6d0;border-radius:3px;background:#fff;color:#2d3742}.micro{font-size:12px;line-height:1.6;color:#606c78;margin:12px 0 0}.dark{background:#202832;color:#e4e8ed}.dark .caption{color:#96a2b0}.tree{font-size:13px;line-height:2.05}.tree .child{padding-left:13px}.tree .selected{background:#454330;border-left:2px solid #c5a54d;padding-left:11px}.tree .dim{color:#a8b2bf}.numeric-grid{display:grid;grid-template-columns:1fr auto;gap:7px 8px;font-size:13px}.numeric-grid strong{font-size:14px;font-weight:500}.ambiguity{font-size:18px;margin:12px 0 0;letter-spacing:.04em}.size-test{display:grid;gap:7px}.size-test p{margin:0}.links{display:flex;flex-wrap:wrap;gap:18px;padding:0 28px 24px;font-size:12px}.links a{color:#536371}.font-state{display:block;margin-top:6px;color:#657263;font-size:11px;font-family:system-ui,sans-serif}.failed{color:#a04133}body.large .body-text,body.large .weight-lines{font-size:16px}body.large .field label,body.large .tree,body.large .labels,body.large .numeric-grid{font-size:14px}body.large .field input{font-size:16px}@media(max-width:1000px){main{grid-template-columns:repeat(2,minmax(0,1fr))}.toolbar{flex-wrap:wrap}.toolbar output{margin-left:0}}@media(max-width:560px){header{padding:18px}main{grid-template-columns:1fr;padding:14px}.toolbar{padding:12px 14px;font-size:12px}.links{padding:0 14px 20px}}
  </style>
</head>
<body>
  <header><h1>RoboCell UI 글꼴 비교</h1><p>같은 문구·폭·굵기·크기로 비교합니다. 후보 3종은 공식 배포 파일, Pretendard는 현재 사용 중인 파일입니다.</p></header>
  <div class="toolbar">
    <label><input id="larger-type" type="checkbox"> 한 단계 큰 작업 글자</label>
    <label><input id="tabular-numbers" type="checkbox" checked> 숫자 고정폭</label>
    <button id="reload-fonts" type="button"> 로딩 상태 확인</button>
    <output id="font-summary" aria-live="polite">글꼴 불러오는 중</output>
  </div>
  <main id="comparison"></main>
  <div class="links">
    <a href="https://www.ibm.com/plex/concept/" target="_blank" rel="noreferrer">IBM 공식 디자인 설명</a>
    <a href="https://github.com/IBM/plex/tree/master/packages/plex-sans-kr" target="_blank" rel="noreferrer">IBM Plex Sans KR 배포</a>
    <a href="https://sun.fo/suit/" target="_blank" rel="noreferrer">SUIT 공식 설명</a>
    <a href="https://github.com/wanteddev/wanted-sans" target="_blank" rel="noreferrer">Wanted Sans 공식 배포</a>
    <a href="studio.html">공장 편집기로</a>
  </div>
  <script type="module">
    const families = [
      {name:'Pretendard', note:'현재 글꼴 · 기준', stack:'Pretendard'},
      {name:'IBM Plex Sans KR', note:'적용 후보 · Regular / Medium / SemiBold', stack:'IBM Plex Sans KR', candidate:true},
      {name:'SUIT', note:'UI 전용 · Regular / Medium / SemiBold', stack:'SUIT'},
      {name:'Wanted Sans', note:'비교 후보 · Regular / Medium / SemiBold', stack:'Wanted Sans'}
    ];
    for (const family of families) {
      const article=document.createElement('article');
      article.className=`specimen${family.candidate?' candidate':''}`;
      article.style.fontFamily=`"${family.stack}",sans-serif`;
      article.innerHTML=`<div class="family"><h2>${family.name}</h2><p>${family.note}</p><span class="font-state">로딩 중</span></div>
        <section><span class="caption">문서 제목 · 19 / 600</span><h3 class="title">CNC 가공 셀 배치 검토</h3><p class="micro">RoboCell Studio · Project A-204</p></section>
        <section><span class="caption">본문 · 14 / 400</span><p class="body-text">설비 치수와 작업 동선을 입력하고, 공장 배치를 검토합니다. 측정값과 가정값을 구분해 실행 결과의 근거를 남깁니다.</p></section>
        <section><span class="caption">속성 패널 · 13 / 500 + 값 14 / 400</span><div class="labels"><span>배치</span><span>설비 속성</span><span>입력 근거</span></div><div class="field"><label>X 위치 (m)<input value="12.75" readonly></label><label>Y 위치 (m)<input value="-0.25" readonly></label></div><p class="micro">통로 여유 폭 1.20 m · 회전 각도 90°</p></section>
        <section class="dark"><span class="caption">장면 목록 · 13px / 밝은 글자</span><div class="tree"><div>공장 / 배치</div><div class="child">CNC 가공기 · MC-01</div><div class="child selected">로봇 셀 · RC-02</div><div class="child dim">작업자 통로 · 1.20 m</div></div></section>
        <section><span class="caption">숫자 · 단위 · 혼동 문자</span><div class="numeric-grid"><span>공장 크기</span><strong>24.00 × 18.00 m</strong><span>설비 점유율</span><strong>18.25 %</strong><span>시뮬레이션 시간</span><strong>71.00 s</strong><span>최소 간격</span><strong>0.025 m</strong></div><p class="ambiguity">0O 1Il 2Z 5S 8B</p><p class="micro">−0.25 / ±0.01 / 90° / ㎡ / ㎜ / 1,024.50</p></section>
        <section><span class="caption">굵기 · 400 / 500 / 600</span><div class="weight-lines"><span style="font-weight:400">측정 근거와 실행 결과 0123456789</span><span style="font-weight:500">측정 근거와 실행 결과 0123456789</span><span style="font-weight:600">측정 근거와 실행 결과 0123456789</span></div></section>
        <section><span class="caption">최소 크기 비교 · 12 / 13 / 14</span><div class="size-test"><p style="font-size:12px">12px — 공장 치수와 로봇 작업 반경</p><p style="font-size:13px">13px — 공장 치수와 로봇 작업 반경</p><p style="font-size:14px">14px — 공장 치수와 로봇 작업 반경</p></div></section>`;
      document.querySelector('#comparison').append(article);
    }
    async function inspectFonts(){
      const results=await Promise.all(families.map(async (family,index)=>{
        const label=document.querySelectorAll('.font-state')[index];
        try {
          const loaded=await Promise.all([400,500,600].map(weight=>document.fonts.load(`${weight} 14px "${family.stack}"`,'공장 배치 0123456789')));
          const valid=loaded.every(faces=>faces.length>0);
          label.textContent=valid?'400 / 500 / 600 로딩 완료':'실제 글꼴 로딩 확인 필요';
          label.classList.toggle('failed',!valid);
          return valid;
        }catch(error){label.textContent='글꼴 로딩 실패';label.classList.add('failed');return false;}
      }));
      document.querySelector('#font-summary').textContent=`${results.filter(Boolean).length} / ${families.length} 글꼴 준비됨`;
    }
    document.querySelector('#larger-type').addEventListener('change',event=>document.body.classList.toggle('large',event.target.checked));
    document.querySelector('#tabular-numbers').addEventListener('change',event=>document.body.style.fontVariantNumeric=event.target.checked?'tabular-nums lining-nums':'proportional-nums lining-nums');
    document.querySelector('#reload-fonts').addEventListener('click',inspectFonts);
    await inspectFonts();
  </script>
</body>
</html>
